<!DOCTYPE html>
<html lang="en"><head><base href="../"/><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Characters | The Stormfall Observatory</title><link href="assets/site.css" rel="stylesheet"/></head><body><header class="top observatory-top"><div class="wrap top-inner"><a aria-label="Stormfall Observatory homepage" class="masthead" href="index.html"><span class="masthead-kicker">THE</span><span class="masthead-name">STORMFALL</span><span class="masthead-sub">OBSERVATORY</span></a></div></header><main><div class="page active" id="characters"><div class="subhero"><div class="wrap"><div class="eyebrow">The collection</div><h1>Character Archive</h1><p>Portraits stay true to their worlds. The Observatory provides a quiet, consistent space around them.</p></div></div><div class="content wrap"><label class="smallprint" for="search">SEARCH CHARACTERS</label><br/><input class="search" id="search" placeholder="Search names or collections…"/><div class="gallery" id="fullGallery"></div></div></div></main><footer class="footer new-footer inner-page-footer"><span>THE STORMFALL OBSERVATORY</span><span>Worlds · Characters · Lore</span></footer><script>const chars=[{id:'wesley',name:'Wesley Harlan',collection:'The Midnight Court',image:'wesley.webp'},{id:'barbarian',name:'Fantasy Character',collection:'Fantasy',image:'barbarian.webp'},{id:'benjamin',name:'Benjamin Carrick',collection:'Character Archive',image:'benjamin.webp'},{id:'tobin',name:'Tobin Holt',collection:'Character Archive',image:'tobin.webp'}];const full=document.getElementById('fullGallery');function filter(){let q=document.getElementById('search').value.toLowerCase();full.innerHTML=chars.filter(c=>(c.name+' '+c.collection).toLowerCase().includes(q)).map(c=>`<a class="portrait" href="characters/profile/index.html?id=${c.id}"><img src="assets/${c.image}" alt="Portrait of ${c.name}" loading="lazy"><div class="info"><h3>${c.name}</h3><p>${c.collection}</p></div></a>`).join('')||'<p class="empty">No matching characters.</p>'}document.getElementById('search').addEventListener('input',filter);filter();</script></body></html>
